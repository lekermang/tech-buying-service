name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare web folder
        run: |
          mkdir -p www
          cat > www/index.html <<'HTML'
          <!DOCTYPE html>
          <html><head><meta charset="UTF-8"><title>Скупка 24</title>
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <style>body{margin:0;background:#0D0D0D;color:#FFD700;font-family:sans-serif;
          display:flex;align-items:center;justify-content:center;height:100vh}</style>
          </head><body>Открываем Скупка 24…</body></html>
          HTML

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install --save @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.skupka24.app",
            "appName": "Скупка 24",
            "webDir": "www",
            "server": {
              "url": "https://skypka24.com/staff",
              "cleartext": false,
              "allowNavigation": ["skypka24.com", "*.skypka24.com", "*.poehali.dev"]
            }
          }
          JSON

          npx cap add android

      - name: Download app icon
        run: |
          curl -sL -o icon.jpg "https://cdn.poehali.dev/projects/aebcc4b4-364a-471f-b076-f05b82d2d364/files/5861d7c7-1191-429c-9433-e85e74cc215b.jpg"
          sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          convert icon.jpg -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert icon.jpg -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icon.jpg -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert icon.jpg -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert icon.jpg -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Skupka24.apk

      - uses: actions/upload-artifact@v4
        with:
          name: skupka24-android
          path: out/Skupka24.apk

      - name: Publish to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Скупка 24 — последняя версия"
          body: "Автоматическая сборка. .exe для Windows + .apk для Android."
          files: out/Skupka24.apk
          prerelease: false
          make_latest: "true"
