name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Prepare web folder
        run: |
          mkdir -p www
          cat > www/index.html <<'HTML'
          <!DOCTYPE html>
          <html><head><meta charset="UTF-8"><title>Скупка 24</title>
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <style>body{margin:0;background:#0D0D0D;color:#FFD700;font-family:sans-serif;
          display:flex;align-items:center;justify-content:center;height:100vh;font-size:14px}</style>
          </head><body>Открываем Скупка 24…</body></html>
          HTML

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install --save @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.skupka24.app",
            "appName": "Скупка 24",
            "webDir": "www",
            "server": {
              "url": "https://skypka24.com/staff",
              "cleartext": false,
              "allowNavigation": [
                "skypka24.com",
                "*.skypka24.com",
                "*.poehali.dev",
                "github.com",
                "*.githubusercontent.com"
              ]
            },
            "android": {
              "allowMixedContent": false,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          JSON

          npx cap add android

      - name: Inject Android permissions
        run: |
          python3 - <<'PY'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, 'r', encoding='utf-8') as f:
              data = f.read()
          perms = """    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <application"""
          if "POST_NOTIFICATIONS" not in data:
              data = data.replace("    <application", perms, 1)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(data)
              print("Permissions injected")
          else:
              print("Permissions already exist")
          PY

      - name: Download and prepare app icon
        run: |
          sudo apt-get install -y imagemagick
          curl -sL -o icon.jpg "https://cdn.poehali.dev/projects/aebcc4b4-364a-471f-b076-f05b82d2d364/files/5861d7c7-1191-429c-9433-e85e74cc215b.jpg"
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            den=${d%:*}; sz=${d#*:}
            mkdir -p android/app/src/main/res/mipmap-$den
            convert icon.jpg -resize ${sz}x${sz} android/app/src/main/res/mipmap-$den/ic_launcher.png
            cp android/app/src/main/res/mipmap-$den/ic_launcher.png android/app/src/main/res/mipmap-$den/ic_launcher_round.png
          done

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Skupka24.apk

      - name: Publish to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Скупка 24 — последняя версия"
          body: "Автоматическая сборка APK. Камера, push-уведомления, авто-обновление."
          files: out/Skupka24.apk
          prerelease: false
          make_latest: "true"
