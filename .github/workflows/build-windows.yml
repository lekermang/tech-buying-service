name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Prepare dummy dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tauri-dist | Out-Null
          Set-Content -Path tauri-dist/index.html -Value "<html><body>Скупка 24</body></html>"

      - name: Download icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons | Out-Null
          Invoke-WebRequest -Uri "https://cdn.poehali.dev/projects/aebcc4b4-364a-471f-b076-f05b82d2d364/files/5861d7c7-1191-429c-9433-e85e74cc215b.jpg" -OutFile icon.jpg

      - run: npm install -g @tauri-apps/cli@^1
      - run: tauri icon icon.jpg --output src-tauri/icons
      - run: tauri build

      - name: Rename to ASCII filename
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $exe = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          Copy-Item $exe.FullName "out/Skupka24-Setup.exe"
          Write-Host "Saved: out/Skupka24-Setup.exe"

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $json = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $v = $json.package.version
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: skupka24-windows
          path: out/Skupka24-Setup.exe

      - name: Publish/Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Скупка 24 — последняя версия"
          body: "Автоматическая сборка. Версия ${{ steps.ver.outputs.version }}"
          files: out/Skupka24-Setup.exe
          prerelease: false
          make_latest: "true"
