name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^1

      - name: Prepare dummy dist
        shell: bash
        run: |
          mkdir -p tauri-dist
          echo '<!DOCTYPE html><html><body>Redirecting...</body></html>' > tauri-dist/index.html

      - name: Generate placeholder icons
        shell: pwsh
        run: |
          $iconDir = "src-tauri/icons"
          New-Item -ItemType Directory -Force -Path $iconDir | Out-Null
          # Скачиваем иконку с CDN проекта
          Invoke-WebRequest -Uri "https://cdn.poehali.dev/projects/aebcc4b4-364a-471f-b076-f05b82d2d364/files/5861d7c7-1191-429c-9433-e85e74cc215b.jpg" -OutFile "$iconDir/source.jpg"
          # Конвертируем через ImageMagick (есть в windows-latest)
          choco install imagemagick.app -y --no-progress
          magick "$iconDir/source.jpg" -resize 32x32 "$iconDir/32x32.png"
          magick "$iconDir/source.jpg" -resize 128x128 "$iconDir/128x128.png"
          magick "$iconDir/source.jpg" -resize 256x256 "$iconDir/128x128@2x.png"
          magick "$iconDir/source.jpg" -resize 512x512 "$iconDir/icon.png"
          magick "$iconDir/source.jpg" -define icon:auto-resize=256,128,64,48,32,16 "$iconDir/icon.ico"

      - name: Build Tauri
        working-directory: src-tauri
        run: cargo tauri build

      - name: Rename installer
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target/release/bundle/nsis -name "*.exe" -exec cp {} out/Skupka24-Setup.exe \;
          ls -la out/

      - name: Publish to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Скупка 24 — последняя версия"
          body: "Автоматическая сборка Windows-версии. Push-уведомления, чат команды, авто-обновление."
          files: out/Skupka24-Setup.exe
          prerelease: false
          make_latest: "true"
